<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2d6e" />
    <title>Каллиграф</title>
    <style>
      #boot { font: 16px/1.45 system-ui, sans-serif; padding: 24px 18px; color: #1d1f33; }
      #boot.err { color: #8a1c1c; white-space: pre-wrap; word-break: break-word; }
    </style>
    <script>
      // Вместо белого экрана — понятное сообщение, что пошло не так.
      (function () {
        var errs = [];
        function show(text) {
          var b = document.getElementById('boot');
          if (!b) return;
          b.className = 'err';
          b.textContent = 'Интерфейс не запустился.\n\n' + text + '\n\nWebView: ' + navigator.userAgent;
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) errs.push('Не загрузился файл: ' + (t.src || t.href));
          else errs.push(String(e.message || e.error || 'ошибка') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
          show(errs.join('\n'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { errs.push('Ошибка: ' + (e.reason && e.reason.message || e.reason)); show(errs.join('\n')); });
        setTimeout(function () {
          if (document.getElementById('boot')) show(errs.join('\n') || 'Скрипт интерфейса не выполнился за 8 секунд. Возможно, браузер телефона (Android System WebView) устарел — обновите его в Play Маркете.');
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <div id="root"><div id="boot">Загрузка…</div></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
